service:
  name: checkout
  environment: prod
  port: 5050
  targetPort: 5050

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

rollout:
  strategy: canary
  trafficRouting:
    istio:
      enabled: true
  steps:
    - setWeight: 10
    - pause:
        duration: 10m
    - setWeight: 25
    - pause:
        duration: 15m
    - setWeight: 50
    - pause:
        duration: 15m
    - setWeight: 100

observability:
  metrics:
    enabled: true
  tracing:
    enabled: true

istio:
  enabled: true

env:
  - name: CHECKOUT_PORT
    value: "5050"
  - name: CART_ADDR
    value: "cart:7070"
  - name: CURRENCY_ADDR
    value: "currency:7001"
  - name: EMAIL_ADDR
    value: "http://email:6060"
  - name: PAYMENT_ADDR
    value: "payment:50051"
  - name: PRODUCT_CATALOG_ADDR
    value: "product-catalog:3550"
  - name: SHIPPING_ADDR
    value: "http://shipping:50050"
  trafficRouting:
    enabled: true
  mtls:
    enabled: true
  authorizationPolicy:
    enabled: true
