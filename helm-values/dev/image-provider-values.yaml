service:
  name: image-provider
  environment: dev
  port: 8081
  targetPort: 8081

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/image-provider"
  tag: "696fa29706a48fbf2d1de7a314a3ab3210bbc1c2"
  digest: "sha256:a6a977b6f7f32c16a21b046447af5bac8085ec65c03777f15f3109ba36717130"
  pullPolicy: IfNotPresent

replicaCount: 1

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

rollout:
  strategy: canary
  maxUnavailable: 0
  maxSurge: 1

observability:
  metrics:
    enabled: false
  tracing:
    enabled: false

istio:
  enabled: false

env:
  - name: IMAGE_PROVIDER_PORT
    value: "8081"

envFrom:
  - secretRef:
      name: astronomy-shop-runtime
      optional: false
