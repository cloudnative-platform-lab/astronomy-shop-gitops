service:
  name: shipping
  environment: dev
  port: 50051
  targetPort: 50051

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/shipping"
  tag: "8ca520da1e5b850ef3243cb00c267c7814ac8266"
  digest: "sha256:bd1ca1d509871fadee49a481914da64b09e69bc4a74a8a7a1a4eb67d9c7815f1"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

rollout:
  strategy: canary
  maxUnavailable: 1
  maxSurge: 0

observability:
  metrics:
    enabled: false
  tracing:
    enabled: false

istio:
  enabled: false

env:
  - name: SHIPPING_PORT
    value: "50051"
