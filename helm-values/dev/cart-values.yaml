service:
  name: cart
  environment: dev

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/cart"
  tag: "e8c2c05972ef09d6773fd00956f69306b1a2fcb3"
  digest: "sha256:c4a9dc3ac25f89366f9cb271ebe933a63a8677aa057cd1d540ca6271099021b2"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

rollout:
  strategy: canary
  maxUnavailable: 0
  maxSurge: 1

observability:
  metrics:
    enabled: false
  tracing:
    enabled: false

istio:
  enabled: false

envFrom:
  - secretRef:
      name: astronomy-shop-runtime
      optional: false
