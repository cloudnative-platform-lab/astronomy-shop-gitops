service:
  name: cart
  environment: dev

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/cart"
  tag: "8271936691459a74f63a710323ecc472ca0f32e6"
  digest: "sha256:6f0e8efef468b204c2ddc74dc49ecb04d101c3dcfad379d442042709e379b8dd"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

rollout:
  strategy: canary
  maxUnavailable: 0
  maxSurge: 1

observability:
  metrics:
    enabled: false
  tracing:
    enabled: false

istio:
  enabled: false

envFrom:
  - secretRef:
      name: astronomy-shop-runtime
      optional: false
