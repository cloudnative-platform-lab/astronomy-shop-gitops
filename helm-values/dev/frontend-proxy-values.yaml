service:
  name: frontend-proxy
  environment: dev
  port: 8080
  targetPort: 8080

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/frontend-proxy"
  tag: "0392223a4f44e97deddc2b588a37586b8688f327"
  digest: "sha256:fcd42d5858565192ffa080ad8e693f527cedfd848a4c092aedd732c437473443"
  pullPolicy: IfNotPresent

replicaCount: 1

extraVolumes:
  - name: envoy-runtime
    emptyDir: {}

extraVolumeMounts:
  - name: envoy-runtime
    mountPath: /tmp

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

rollout:
  strategy: canary
  trafficRouting:
    alb:
      enabled: true
      ingressName: frontend-proxy-ingress
      servicePort: 8080
    istio:
      enabled: false
  steps:
    - setWeight: 10
    - pause:
        duration: 5m
    - setWeight: 25
    - pause:
        duration: 10m
    - setWeight: 50
    - pause:
        duration: 10m
    - setWeight: 100
  maxUnavailable: 1
  maxSurge: 0

observability:
  metrics:
    enabled: false
  tracing:
    enabled: false

istio:
  enabled: false

networkPolicy:
  enabled: true
  ingress:
    allowAllSources: true

ingress:
  # The platform Terraform stack owns the single public ALB and TLS listener.
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:241766333730:certificate/f039d421-7fd6-4f51-8fe7-99bcf3f2f07b"
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=astronomy-shop-dev-241766333730-alb-logs,access_logs.s3.prefix=dev
  hosts:
    - host: dev.astronomy-shop.store
      paths:
        - path: /
          pathType: Prefix

env:
  - name: ENVOY_PORT
    value: "8080"
  - name: OTEL_SERVICE_NAME
    value: "frontend-proxy"
  - name: OTEL_COLLECTOR_HOST
    value: "opentelemetry-collector.observability.svc.cluster.local"
  - name: OTEL_COLLECTOR_PORT_GRPC
    value: "4317"
  - name: OTEL_COLLECTOR_PORT_HTTP
    value: "4318"
  - name: FRONTEND_HOST
    value: "frontend"
  - name: FRONTEND_PORT
    value: "8080"
  - name: IMAGE_PROVIDER_HOST
    value: "image-provider"
  - name: IMAGE_PROVIDER_PORT
    value: "8081"
  - name: FLAGD_HOST
    value: "flagd"
  - name: FLAGD_PORT
    value: "8013"
  - name: FLAGD_UI_HOST
    value: "flagd-ui"
  - name: FLAGD_UI_PORT
    value: "4000"
  - name: LOCUST_WEB_HOST
    value: "load-generator"
  - name: LOCUST_WEB_PORT
    value: "8089"
  - name: GRAFANA_HOST
    value: "grafana"
  - name: GRAFANA_PORT
    value: "3000"
  - name: JAEGER_HOST
    value: "jaeger"
  - name: JAEGER_PORT
    value: "16686"
