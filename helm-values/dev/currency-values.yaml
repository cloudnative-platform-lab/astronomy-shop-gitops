service:
  name: currency
  environment: dev
  port: 7001
  targetPort: 7001

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/currency"
  tag: "3a3abed441e6755dfec6c4313993a104094f6728"
  digest: "sha256:0c0b2ace14a0dbc07db564d71119e91d422b6c819c138d16df516fd56712bce4"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
