service:
  name: product-catalog
  environment: dev
  port: 3550
  targetPort: 3550

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/product-catalog"
  tag: "ad311d672caa4401e5a3a7dc082729491772f66b"
  digest: "sha256:dfee7f628cec94982530a9267b9c0a568c3d17846d2d5c4d24531a8517085d3f"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

rollout:
  strategy: canary
  maxUnavailable: 0
  maxSurge: 1

observability:
  metrics:
    enabled: false
  tracing:
    enabled: false

istio:
  enabled: false

env:
  - name: PRODUCT_CATALOG_PORT
    value: "3550"
