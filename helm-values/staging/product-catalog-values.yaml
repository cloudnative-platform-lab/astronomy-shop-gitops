service:
  name: product-catalog
  environment: staging
  port: 3550
  targetPort: 3550

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/product-catalog"
  tag: "0f85fbcee0e4a63291dfa68f028f4421ba1c529e"
  digest: "sha256:290200243b6bca8fe583b963f74e782e6fc1d755283cc9beaf7ac4ae03ff0f97"
  pullPolicy: IfNotPresent

replicaCount: 2

podAnnotations:
  platform.astronomy-shop/mesh-validation: "staging-cni-verified"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 600m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

rollout:
  strategy: canary
  trafficRouting:
    istio:
      enabled: false
  steps:
    - setWeight: 25
    - pause:
        duration: 5m
    - setWeight: 50
    - pause:
        duration: 10m
    - setWeight: 100

observability:
  metrics:
    enabled: true
  tracing:
    enabled: true

istio:
  enabled: false
  trafficRouting:
    enabled: false
  mtls:
    enabled: false
  authorizationPolicy:
    enabled: false

env:
  - name: PRODUCT_CATALOG_PORT
    value: "3550"
