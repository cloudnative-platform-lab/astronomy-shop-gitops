service:
  name: checkout
  environment: staging
  port: 5050
  targetPort: 5050

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/checkout"
  tag: "0392223a4f44e97deddc2b588a37586b8688f327"
  digest: "sha256:5a0dbe4642b96c4eb7967cd911cd2e2d35e9aefd121e27c241d2e86dcb875294"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 600m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

rollout:
  strategy: canary
  trafficRouting:
    istio:
      enabled: false
  steps:
    - setWeight: 25
    - pause:
        duration: 5m
    - setWeight: 50
    - pause:
        duration: 10m
    - setWeight: 100

observability:
  metrics:
    enabled: true
  tracing:
    enabled: true

istio:
  enabled: false
  trafficRouting:
    enabled: false
  mtls:
    enabled: false
  authorizationPolicy:
    enabled: false

env:
  - name: CHECKOUT_PORT
    value: "5050"
  - name: CART_ADDR
    value: "cart:8080"
  - name: CURRENCY_ADDR
    value: "currency:7001"
  - name: EMAIL_ADDR
    value: "http://email:6060"
  - name: PAYMENT_ADDR
    value: "payment:50051"
  - name: PRODUCT_CATALOG_ADDR
    value: "product-catalog:3550"
  - name: SHIPPING_ADDR
    value: "http://shipping:50050"
