service:
  name: recommendation
  environment: staging
  port: 1010
  portName: grpc
  targetPort: 1010

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/recommendation"
  tag: "b7fe39a2cb594b46cf6d96884d9aff3fc7805127"
  digest: "sha256:c7d2256bdc6377199956365a06496ade210923747c96dabe5cd5175e7912376b"
  pullPolicy: IfNotPresent

replicaCount: 2

podAnnotations:
  astronomy-shop.io/istio-routing-validation: "20260814062514"
  sidecar.istio.io/inject: "true"
  platform.astronomy-shop/mesh-validation: "staging-routing-validation-v2"
  astronomy-shop.io/canary-validation: "routing-recovery-v1"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 600m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

rollout:
  strategy: canary
  trafficRouting:
    istio:
      enabled: true
  steps:
    - setWeight: 25
    - pause:
        duration: 5m
    - setWeight: 50
    - pause:
        duration: 10m
    - setWeight: 100
  analysis:
    enabled: true

observability:
  metrics:
    enabled: true
  tracing:
    enabled: true

istio:
  enabled: true
  trafficRouting:
    enabled: true
  mtls:
    enabled: false
  authorizationPolicy:
    enabled: false

env:
  - name: ASTRONOMY_SHOP_SERVING_REVISION
    valueFrom:
      fieldRef:
        fieldPath: metadata.labels['rollouts-pod-template-hash']
  - name: RECOMMENDATION_PORT
    value: "1010"
  - name: PRODUCT_CATALOG_ADDR
    value: "product-catalog:3550"
