service:
  name: frontend-proxy
  environment: staging
  port: 8080
  targetPort: 8080

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/frontend-proxy"
  tag: "0392223a4f44e97deddc2b588a37586b8688f327"
  digest: "sha256:fcd42d5858565192ffa080ad8e693f527cedfd848a4c092aedd732c437473443"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 600m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

rollout:
  strategy: canary
  trafficRouting:
    alb:
      enabled: false
      ingressName: frontend-proxy-ingress
      servicePort: 8080
    istio:
      enabled: false
  steps:
    - setWeight: 25
    - pause:
        duration: 5m
    - setWeight: 50
    - pause:
        duration: 10m
    - setWeight: 100

observability:
  metrics:
    enabled: true
  tracing:
    enabled: true

istio:
  enabled: false
  trafficRouting:
    enabled: false
  mtls:
    enabled: false
  authorizationPolicy:
    enabled: false

networkPolicy:
  enabled: true
  ingress:
    allowAllSources: true

ingress:
  # The platform Terraform stack owns the single public ALB and TLS listener.
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  hosts:
    - host: staging.astronomy-shop.example.com
      paths:
        - path: /
          pathType: Prefix

env:
  - name: ENVOY_PORT
    value: "8080"
  - name: OTEL_SERVICE_NAME
    value: "frontend-proxy"
  - name: OTEL_COLLECTOR_HOST
    value: "otel-collector"
  - name: OTEL_COLLECTOR_PORT_GRPC
    value: "4317"
  - name: OTEL_COLLECTOR_PORT_HTTP
    value: "4318"
  - name: FRONTEND_HOST
    value: "frontend"
  - name: FRONTEND_PORT
    value: "8080"
  - name: IMAGE_PROVIDER_HOST
    value: "image-provider"
  - name: IMAGE_PROVIDER_PORT
    value: "8081"
  - name: FLAGD_HOST
    value: "flagd"
  - name: FLAGD_PORT
    value: "8013"
  - name: FLAGD_UI_HOST
    value: "flagd-ui"
  - name: FLAGD_UI_PORT
    value: "4000"
  - name: LOCUST_WEB_HOST
    value: "load-generator"
  - name: LOCUST_WEB_PORT
    value: "8089"
  - name: GRAFANA_HOST
    value: "grafana"
  - name: GRAFANA_PORT
    value: "3000"
  - name: JAEGER_HOST
    value: "jaeger"
  - name: JAEGER_PORT
    value: "16686"
