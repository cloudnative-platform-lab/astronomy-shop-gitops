service:
  name: email
  environment: staging
  port: 8080
  targetPort: 8080

image:
  repository: "241766333730.dkr.ecr.ap-south-1.amazonaws.com/astronomy-shop/email"
  tag: "0f85fbcee0e4a63291dfa68f028f4421ba1c529e"
  digest: "sha256:b84640e916528b5e69bab05ff65f4c6a8be8565a5acbc56947ceb942a1d08a4b"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

rollout:
  strategy: canary

observability:
  metrics:
    enabled: true
  tracing:
    enabled: true

istio:
  enabled: false

env:
  - name: EMAIL_PORT
    value: "8080"
