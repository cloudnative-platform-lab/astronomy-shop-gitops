{{- if and (eq .Values.rollout.strategy "canary") .Values.rollout.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "astronomy-shop-service.fullname" . }}-availability
  labels:
    {{- include "astronomy-shop-service.labels" . | nindent 4 }}
spec:
  args:
    - name: namespace
    - name: service
    - name: latest-hash
  metrics:
    - name: canary-ready-pods
      interval: {{ .Values.rollout.analysis.canaryReadyPods.interval }}
      count: {{ .Values.rollout.analysis.canaryReadyPods.count }}
      successCondition: {{ .Values.rollout.analysis.canaryReadyPods.successCondition | quote }}
      failureLimit: {{ .Values.rollout.analysis.canaryReadyPods.failureLimit }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |
            sum(
              kube_pod_status_ready{namespace="{{`{{args.namespace}}`}}", condition="true"}
              * on(namespace, pod) group_left()
              kube_pod_owner{namespace="{{`{{args.namespace}}`}}", owner_kind="ReplicaSet", owner_name="{{`{{args.service}}`}}-{{`{{args.latest-hash}}`}}"}
            )
{{- end }}
