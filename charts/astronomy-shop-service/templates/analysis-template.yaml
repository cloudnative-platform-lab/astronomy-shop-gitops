{{- if and (eq .Values.rollout.strategy "canary") .Values.rollout.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "astronomy-shop-service.fullname" . }}-availability
  labels:
    {{- include "astronomy-shop-service.labels" . | nindent 4 }}
spec:
  args:
    - name: namespace
    - name: service
    - name: latest-hash
  metrics:
    - name: canary-ready-pods
      interval: 30s
      count: 5
      successCondition: len(result) > 0 && result[0] >= 1
      failureLimit: 3
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |
            sum(
              kube_pod_status_ready{namespace="{{`{{args.namespace}}`}}", condition="true"}
              * on(namespace, pod) group_left()
              kube_pod_labels{namespace="{{`{{args.namespace}}`}}", label_rollouts_argoproj_io_pod_template_hash="{{`{{args.latest-hash}}`}}"}
            )
{{- end }}
