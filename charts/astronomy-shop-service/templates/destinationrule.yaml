{{- if and .Values.istio.enabled .Values.istio.trafficRouting.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "astronomy-shop-service.istio.destinationRuleName" . }}
  labels:
    {{- include "astronomy-shop-service.labels" . | nindent 4 }}
spec:
  host: {{ include "astronomy-shop-service.fullname" . }}
  subsets:
    - name: stable
    - name: canary
{{- end }}
