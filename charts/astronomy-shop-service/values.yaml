service:
  name: ""
  environment: ""
  port: 8080
  targetPort: 8080

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

serviceAccount:
  name: ""

podAnnotations: {}

terminationGracePeriodSeconds: 30

startupProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 30

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

configMap:
  enabled: false
  data: {}
  envFrom: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

rollout:
  strategy: canary
  maxUnavailable: 0
  maxSurge: 1
  steps:
    - setWeight: 100
  trafficRouting:
    alb:
      enabled: false
      ingressName: ""
      servicePort: 80
    istio:
      enabled: false
      virtualService:
        name: ""
        routes:
          - primary
      destinationRule:
        name: ""
  analysis:
    enabled: false
    prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090

istio:
  enabled: false
  trafficRouting:
    enabled: false
  mtls:
    enabled: false
    mode: STRICT
  authorizationPolicy:
    enabled: false
    action: ALLOW
    rules: []

observability:
  metrics:
    enabled: false
    path: /metrics
    interval: 30s
  tracing:
    enabled: false
    endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4317
    protocol: grpc

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

networkPolicy:
  enabled: true
  ingress:
    allowAllSources: false
    from: []
  egress:
    enabled: false
    rules: []

env: []
envFrom: []
